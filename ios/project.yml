name: GoTogether
options:
  bundleIdPrefix: com.gotogether
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "GoTogether shows your location on the map so riders near you can find you."
    MARKETING_VERSION: "0.2"
    CURRENT_PROJECT_VERSION: "2"
targets:
  GoTogether:
    type: application
    platform: iOS
    sources: [GoTogether]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gotogether.app
        INFOPLIST_KEY_CFBundleDisplayName: GoTogether
  GoTogetherTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GoTogetherTests]
    dependencies:
      - target: GoTogether
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
